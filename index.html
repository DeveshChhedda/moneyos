<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyOS</title>
<meta name="description" content="MoneyOS: a private, local-first personal finance app. Your data stays on your device.">
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MoneyOS">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231B1D22'/%3E%3Crect x='24' y='24' width='16' height='16' rx='5' fill='%232FB594'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F0F1F4;--line:#E4E6EB;--line-2:#D6D9E0;
  --text:#1B1D22;--muted:#6B7080;--faint:#9BA0AC;
  --accent:#0B7A63;--accent-soft:#E3F2EE;--on-accent:#FFFFFF;
  --in:#0B7A63;--out:#C2413A;--inv:#4B5BD6;--debt:#B26B00;
  --in-soft:#E3F2EE;--out-soft:#FBEAE8;--inv-soft:#ECEEFC;--debt-soft:#FBF1E0;
  --r-card:18px;--r-ctl:12px;--r-sheet:24px;
  --shadow-sheet:0 -8px 40px rgba(20,22,28,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316;--surface:#1A1C20;--surface-2:#23262B;--line:#2C2F35;--line-2:#3A3E46;
    --text:#F2F3F5;--muted:#A0A6B2;--faint:#6F7580;
    --accent:#2FB594;--accent-soft:#16332C;--on-accent:#06140F;
    --in:#2FB594;--out:#F07167;--inv:#8C98FF;--debt:#E0A43B;
    --in-soft:#16332C;--out-soft:#3A1E1C;--inv-soft:#23264A;--debt-soft:#3A2C12;
    --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316;--surface:#1A1C20;--surface-2:#23262B;--line:#2C2F35;--line-2:#3A3E46;
  --text:#F2F3F5;--muted:#A0A6B2;--faint:#6F7580;
  --accent:#2FB594;--accent-soft:#16332C;--on-accent:#06140F;
  --in:#2FB594;--out:#F07167;--inv:#8C98FF;--debt:#E0A43B;
  --in-soft:#16332C;--out-soft:#3A1E1C;--inv-soft:#23264A;--debt-soft:#3A2C12;
  --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-inv{color:var(--inv)}.c-debt{color:var(--debt)}
.hidden{display:none!important}
svg{display:block}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:8px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.page{max-width:1120px;margin:0 auto;animation:pageIn .22s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{display:flex;align-items:center;gap:8px;padding:10px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.topbar h1{font:700 28px/1.1 var(--display);letter-spacing:-.025em;margin:0;flex:1}
.topbar .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
.tabbar a{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--faint);font-size:11px;font-weight:500}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--text)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:21;height:56px;padding:0 22px 0 18px;
  border-radius:28px;background:var(--text);color:var(--bg);display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .15s}
.fab:active{transform:scale(.96)}
.fab svg{width:22px;height:22px}

@media (min-width:900px){
  .tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;
    padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .brand{font:700 20px var(--display);letter-spacing:-.02em;padding:4px 12px 18px;display:flex;align-items:center;gap:10px}
  .brand i{width:26px;height:26px;border-radius:8px;background:var(--text);display:grid;place-items:center}
  .brand i::after{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
  .sidebar a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
  .sidebar a svg{width:18px;height:18px}
  .sidebar a:hover{background:var(--surface-2);color:var(--text)}
  .sidebar a.on{background:var(--surface-2);color:var(--text)}
  .sidebar .side-add{margin:0 0 14px;justify-content:center;background:var(--text);color:var(--bg)!important;border-radius:12px;padding:11px}
  .sidebar .side-add:hover{background:var(--text);opacity:.9}
  .main{padding:18px 32px 60px}
  .fab{display:none}
  .topbar h1{font-size:30px}
}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}
.card + .card,.stack > * + *{margin-top:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h3{margin:0;font:600 15px var(--font);letter-spacing:-.01em}
.card-h a,.link{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:900px){
  .dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .dash > .card{margin:0}
  .span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
  .g4-d{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .two-col > .card{margin:0}
}
.dash > .card + .card{margin-top:12px}
@media (min-width:900px){.dash > .card + .card{margin-top:0}}

.stat{padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font:650 19px var(--display);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--faint);margin-top:2px}
.big{font:700 34px/1.05 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.mid{font:650 22px/1.1 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px}
.delta.good{background:var(--in-soft);color:var(--in)}.delta.bad{background:var(--out-soft);color:var(--out)}.delta.flat{background:var(--surface-2);color:var(--muted)}

/* hero statement */
.hero{padding:22px 20px 20px}
.hero .when{font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.statement{font:600 25px/1.28 var(--display);letter-spacing:-.025em;margin:10px 0 16px;font-variant-numeric:tabular-nums}
.statement span{white-space:nowrap}
.statement .w{color:var(--muted);font-weight:500}
@media (min-width:900px){.statement{font-size:32px}}
.flow{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.flow i{display:block;height:100%}
.flow-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.flow-legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.health{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.health .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 8px}

/* lists */
.list{margin:0 -18px}
.row{display:flex;align-items:center;gap:12px;padding:11px 18px;min-height:58px;width:100%;text-align:left}
button.row:active,a.row:active{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 38px;background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .a small{display:block;font-size:12px;color:var(--faint);font-weight:500}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;padding:16px 4px 6px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.group .row{padding:11px 16px}
.chev{color:var(--faint);width:16px;height:16px}

/* bars */
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.bar.warn i{background:var(--debt)}.bar.over i{background:var(--out)}
.bar.lg{height:12px;border-radius:6px}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm button{height:30px;font-size:13px}

/* forms */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;height:48px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea.input{height:84px;padding:12px 14px;resize:vertical}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-in{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0 4px}
.amount-in .cur{font:600 34px var(--display);color:var(--faint)}
.amount-in input{border:0;outline:0;background:transparent;font:700 46px var(--display);letter-spacing:-.03em;width:1.6ch;max-width:80%;text-align:left;font-variant-numeric:tabular-nums;padding:0}
.amount-in input::placeholder{color:var(--line-2)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:600px){.cat-grid{grid-template-columns:repeat(6,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;border:1px solid transparent;font-size:12px;font-weight:500;color:var(--muted);min-height:74px}
.cat .e{font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.cat.on{border-color:var(--text);color:var(--text);background:var(--surface-2)}
.cat.on .e{background:var(--surface)}
.cat span:last-child{text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.toggle{position:relative;width:51px;height:31px;flex:0 0 51px}
.toggle input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:16px;background:var(--line-2);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked + i{background:var(--accent)}
.toggle input:checked + i::after{transform:translateX(20px)}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.more summary{list-style:none;padding:10px 0;font-weight:600;font-size:14px;color:var(--accent);cursor:pointer}
details.more summary::-webkit-details-marker{display:none}

.btn{height:50px;border-radius:14px;padding:0 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.block{width:100%}
.btn.sm{height:38px;font-size:14px;padding:0 14px;border-radius:11px}
.btn:active{opacity:.85}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row .btn{flex:1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:40;opacity:0;transition:opacity .22s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:92vh;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-sheet)}
.sheet.show{transform:none}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0;flex:0 0 5px}
.sheet-h{display:flex;align-items:center;padding:8px 12px 6px 20px;gap:8px}
.sheet-h h2{flex:1;margin:0;font:650 18px var(--display);letter-spacing:-.015em}
.sheet-b{overflow:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86vh;border-radius:22px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .22s,opacity .22s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet-grab{display:none}
  .sheet-b{padding-bottom:24px}
}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:550;font-size:14px;z-index:60;transition:all .25s;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast button{color:var(--bg);opacity:.75;font-weight:700}
@media (min-width:900px){.toast{bottom:28px}}

/* banners */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--debt-soft);font-size:14px;margin-bottom:12px}
.banner.info{background:var(--surface-2)}
.banner b{font-weight:600}
.banner .btn{flex:0 0 auto}

/* charts */
.chart{width:100%;overflow:visible}
.chart text{fill:var(--faint);font-size:10.5px;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut-wrap svg{flex:0 0 150px}
.donut-wrap .dl{flex:1;min-width:0}
.dl-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:13.5px;width:100%;text-align:left}
.dl-row.on{background:var(--surface-2)}
.dl-row b{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.dl-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-row em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:420px){.donut-wrap{flex-direction:column}.donut-wrap .dl{width:100%}}
.seg-arc{transition:opacity .2s}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11.5px;color:var(--faint);text-align:center;padding:4px 0;font-weight:600}
.cal button{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;font-weight:550;font-size:14px;font-variant-numeric:tabular-nums}
.cal button.out{color:var(--line-2)}
.cal button.today{background:var(--surface-2)}
.cal button.sel{background:var(--text);color:var(--bg)}
.cal .dots{display:flex;gap:3px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* empty & onboarding */
.empty{text-align:center;padding:36px 20px}
.empty h2{font:700 24px/1.2 var(--display);letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:34ch}
.steps{counter-reset:s;text-align:left}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.step + .step{border-top:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:0 0 28px}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.step b{flex:1;font-weight:550}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{font:650 20px var(--display);margin:0}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text)}
.pin-dots i.f{background:var(--text)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.keypad button{width:76px;height:76px;border-radius:50%;background:var(--surface-2);font:500 28px var(--display)}
.keypad button:active{background:var(--line-2)}
.keypad button.ghost{background:none;font-size:15px;font-weight:600}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14.5px}
.kv + .kv{border-top:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto;margin:0 -18px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:18px}
.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.tbl tr.paid td{color:var(--faint)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.in{background:var(--in-soft);color:var(--in)}.pill.out{background:var(--out-soft);color:var(--out)}.pill.inv{background:var(--inv-soft);color:var(--inv)}.pill.debt{background:var(--debt-soft);color:var(--debt)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--faint)}
.search .input{padding-left:42px;border-radius:14px;background:var(--surface)}
.section-t{font:600 13px var(--font);color:var(--muted);margin:22px 4px 8px}
.acct-swatch{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:0 0 38px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.receipt{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-grid a{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 10px 14px;text-align:center;text-decoration:none;font-size:13px;font-weight:550;display:flex;flex-direction:column;align-items:center;gap:8px}
.more-grid a svg{width:24px;height:24px;color:var(--text)}
.insight{display:flex;gap:10px;padding:10px 0;font-size:14.5px}
.insight + .insight{border-top:1px solid var(--line)}
.insight i{font-style:normal;flex:0 0 auto}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.right{text-align:right}
.small{font-size:13px}
.util-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.page.noanim{animation:none}
:where(svg:not(.chart):not([width])){width:18px;height:18px;flex:0 0 auto}
.row > svg:last-child,.step > svg,.card-h > svg{color:var(--faint);width:16px;height:16px}
.icon-btn span{display:grid;place-items:center}
.chip svg{width:15px;height:15px}
.btn svg{width:18px;height:18px}
.ic svg{width:18px;height:18px}

.chartbox{width:100%}
.stat{min-width:0}
.stat .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g3 .stat{padding:12px 12px}
.g3 .stat .v{font-size:16.5px}
@media (min-width:900px){.g3 .stat{padding:14px 16px}.g3 .stat .v{font-size:19px}}
a.row,a.kv{text-decoration:none;color:inherit}
.card + .grid,.grid + .card,.grid + .grid{margin-top:12px}

</style>
</head>

<script>
'use strict';
/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const mk = s => s.slice(0, 7); // month key YYYY-MM
const curMk = () => mk(today());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (s, n, anchor) => {
  const d = parseD(s); const day = anchor || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(day, dim(t.getFullYear(), t.getMonth()))); return ymd(t);
};
const mkAdd = (k, n) => addMonths(k + '-01', n).slice(0, 7);
const mkEnd = k => { const [y, m] = k.split('-').map(Number); return `${k}-${pad(dim(y, m - 1))}`; };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const mkLabel = (k, long) => { const [y, m] = k.split('-').map(Number); return long ? new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) : MON[m - 1]; };
const fmtDate = (s, opt) => parseD(s).toLocaleDateString('en-IN', opt || { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDay = s => {
  const t = today(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; if (s === addDays(t, 1)) return 'Tomorrow';
  const d = parseD(s); return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) });
};
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;

const CURRENCIES = { INR: ['en-IN', '₹'], USD: ['en-US', '$'], EUR: ['de-DE', '€'], GBP: ['en-GB', '£'], AED: ['en-AE', 'AED '], SGD: ['en-SG', 'S$'] };
let _nf = {};
function fmt(n, o = {}) {
  const c = S.settings.currency || 'INR'; const [loc] = CURRENCIES[c] || CURRENCIES.INR;
  const key = c + (o.dec ? 'd' : '') + (o.compact ? 'c' : '');
  if (!_nf[key]) _nf[key] = new Intl.NumberFormat(loc, { style: 'currency', currency: c, maximumFractionDigits: o.dec ? 2 : 0, minimumFractionDigits: 0, ...(o.compact ? { notation: 'compact', maximumFractionDigits: 1 } : {}) });
  let v = n || 0; if (Object.is(v, -0)) v = 0;
  let s = _nf[key].format(o.abs ? Math.abs(v) : v);
  if (o.sign && v > 0) s = '+' + s;
  return s;
}
const fmtC = n => { // chart axis compact, Indian style
  const c = S.settings.currency || 'INR'; const a = Math.abs(n); const sym = (CURRENCIES[c] || CURRENCIES.INR)[1];
  if (c === 'INR') { if (a >= 1e7) return sym + +(n / 1e7).toFixed(1) + 'Cr'; if (a >= 1e5) return sym + +(n / 1e5).toFixed(1) + 'L'; if (a >= 1e3) return sym + +(n / 1e3).toFixed(0) + 'k'; return sym + Math.round(n); }
  return fmt(n, { compact: true });
};
const pct = (n, d = 0) => (isFinite(n) ? (n * 100).toFixed(d) : '0') + '%';
const num = v => { const n = parseFloat(String(v).replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };

/* ================= IndexedDB ================= */
const STORES = ['transactions', 'accounts', 'categories', 'budgets', 'goals', 'investments', 'loans', 'recurring', 'kv'];
const DB = {
  db: null, mem: false,
  open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) { this.mem = true; return res(); }
      let req; try { req = indexedDB.open('moneyos', 1); } catch (e) { this.mem = true; return res(); }
      req.onupgradeneeded = () => { const db = req.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) { const os = db.createObjectStore(s, { keyPath: 'id' }); if (s === 'transactions') os.createIndex('date', 'date'); } }); };
      req.onsuccess = () => { this.db = req.result; res(); };
      req.onerror = () => { this.mem = true; res(); };
    });
  },
  tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); },
  all(store) { if (this.mem) return Promise.resolve([]); return new Promise((res, rej) => { const r = this.tx(store, 'readonly').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(store, obj) { if (this.mem) return Promise.resolve(); return new Promise((res, rej) => { const r = this.tx(store, 'readwrite').put(obj); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  del(store, id) { if (this.mem) return Promise.resolve(); return new Promise((res, rej) => { const r = this.tx(store, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  bulk(store, arr, clear) {
    if (this.mem) return Promise.resolve();
    return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); const os = t.objectStore(store); if (clear) os.clear(); arr.forEach(o => os.put(o)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  },
};

/* ================= state ================= */
const S = { transactions: [], accounts: [], categories: [], budgets: [], goals: [], investments: [], loans: [], recurring: [], settings: {}, meta: {}, v: 0 };
const DEFAULT_SETTINGS = {
  theme: 'system', currency: 'INR', monthsInChart: 6, backupDays: 14,
  widgets: [['month', 1], ['networth', 1], ['available', 1], ['cashflow', 1], ['breakdown', 1], ['budget', 1], ['upcoming', 1], ['cards', 1], ['loans', 1], ['investments', 1], ['goals', 1], ['recent', 1]],
};
const WIDGET_NAMES = { networth: 'Net worth', month: 'This month', available: 'Available money', cashflow: 'Cash flow chart', breakdown: 'Expense breakdown', budget: 'Budgets', upcoming: 'Upcoming payments', cards: 'Credit cards', loans: 'Loans', investments: 'Investments', goals: 'Goals', recent: 'Recent transactions' };

const CAT_COLORS = ['#0B7A63', '#4B5BD6', '#C2413A', '#B26B00', '#7A5AA6', '#2E7FA8', '#9A6B4F', '#5E8C3A', '#B04F86', '#6B7080', '#3C8C88', '#8A7A2E'];
const DEFAULT_CAT_COLORS = { Housing: '#0B7A63', Food: '#D08A2E', Groceries: '#5E8C3A', Transport: '#2E7FA8', Shopping: '#7A5AA6', Utilities: '#3C8C88', Entertainment: '#B04F86', Health: '#C2413A', Travel: '#4B5BD6', EMI: '#6B4E3D', Subscriptions: '#8A7A2E', Insurance: '#56657A', Education: '#8E5B9E', 'Personal care': '#C97B63', Gifts: '#D0677A', Other: '#9BA0AC', Salary: '#0B7A63', Bonus: '#4B5BD6', Freelance: '#7A5AA6', Interest: '#3C8C88', Dividends: '#D08A2E', Refund: '#2E7FA8', 'Other income': '#9BA0AC' };
const DEFAULT_CATS = [
  ['exp', 'Housing', '🏠', 1], ['exp', 'Food', '🍽️', 1], ['exp', 'Groceries', '🛒', 1], ['exp', 'Transport', '🚕', 1], ['exp', 'Shopping', '🛍️', 0], ['exp', 'Utilities', '💡', 1],
  ['exp', 'Entertainment', '🎬', 0], ['exp', 'Health', '💊', 1], ['exp', 'Travel', '✈️', 0], ['exp', 'EMI', '🏦', 1], ['exp', 'Subscriptions', '📺', 0], ['exp', 'Insurance', '🛡️', 1],
  ['exp', 'Education', '📚', 0], ['exp', 'Personal care', '💈', 0], ['exp', 'Gifts', '🎁', 0], ['exp', 'Other', '•', 0],
  ['inc', 'Salary', '💼', 0], ['inc', 'Bonus', '🎉', 0], ['inc', 'Freelance', '🧑‍💻', 0], ['inc', 'Interest', '🏛️', 0], ['inc', 'Dividends', '📈', 0], ['inc', 'Refund', '↩️', 0], ['inc', 'Other income', '•', 0],
];
const INV_TYPES = ['Stocks', 'Mutual Funds', 'ETFs', 'Bonds', 'Gold', 'Fixed Deposits', 'PPF', 'NPS', 'Other'];

async function loadAll() {

function monthStats(k) {
  return memo('ms' + k, () => {
    const r = { income: 0, expense: 0, investment: 0, emi: 0, essential: 0, byCat: {}, count: 0 };
    for (const t of S.transactions) {
      if (mk(t.date) !== k) continue; const a = +t.amount || 0; r.count++;
      if (t.type === 'income') r.income += a;
      else if (t.type === 'expense') { r.expense += a; r.byCat[t.categoryId] = (r.byCat[t.categoryId] || 0) + a; const c = catById(t.categoryId); if (c?.name === 'EMI') r.emi += a; if (c?.essential) r.essential += a; }

    r.cashflow = r.income - r.expense - r.investment;

    const rows = []; let bal = P; const first = l.firstEmiDate || addMonths(l.startDate, 1);

/* ---------- investments ---------- */
function invValueAt(inv, date) {

  const span = daysBetween(inv.date, t); if (span <= 0) return +inv.currentValue || 0;
  const f = clamp(daysBetween(inv.date, date) / span, 0, 1); return (+inv.invested) + ((+inv.currentValue) - (+inv.invested)) * f;
}

/* ---------- net worth ---------- */
function netWorth(date = today()) {
  return memo('nw' + date, () => {
    const b = date >= today() ? balances() : balances(date);
    const r = { bank: 0, cash: 0, investAcct: 0, otherAssets: 0, investments: 0, card: 0, loans: 0, otherLiab: 0 };
    for (const a of S.accounts) {
      if (a.createdAt && a.openingDate && a.openingDate > date) continue;
      const v = b[a.id] || 0;
      if (a.type === 'bank' || a.type === 'savings') r.bank += v; else if (a.type === 'cash' || a.type === 'wallet') r.cash += v;
      else if (a.type === 'investment') r.investAcct += v; else if (a.type === 'asset') r.otherAssets += v;
      else if (a.type === 'credit') r.card += Math.max(0, -v); else if (a.type === 'liability') r.otherLiab += Math.abs(v);
    }
    r.investments = sum(S.investments, x => invValueAt(x, date));
    r.loans = sum(S.loans, l => l.startDate <= date ? loanStatus(l, date).outstanding : 0);
    r.assets = r.bank + r.cash + r.investAcct + r.otherAssets + r.investments;
    r.liabilities = r.card + r.loans + r.otherLiab;

}

  const t = today(); const created = [];

    const from = r.lastPosted ? addDays(r.lastPosted, 1) : r.startDate;
    const dates = occurrences(r, from, t).slice(0, 400);
    for (const d of dates) {

/* ---------- upcoming events (next N days) ---------- */
function events(from, to) {

    if (r.paused) continue;
    const start = r.autoPost && r.lastPosted && r.lastPosted >= from ? addDays(r.lastPosted, 1) : from;
    for (const d of occurrences(r, start, to)) ev.push({ date: d, kind: r.type === 'income' ? 'income' : r.type === 'investment' ? 'sip' : 'bill', title: r.description, amount: +r.amount, ref: r.id, src: 'recurring' });
  }
  for (const a of S.accounts) {

    const out = Math.max(0, -(balances()[a.id] || 0));
    let d = cardDates(a, from).due; let g = 0;
    while (d <= to && g++ < 24) { if (d >= from) ev.push({ date: d, kind: 'card', title: a.name + ' due', amount: out, ref: a.id, src: 'card' }); d = addMonths(d, 1, +a.dueDay); }
  }

    for (const row of loanStatus(l).rows) if (row.date >= from && row.date <= to) ev.push({ date: row.date, kind: 'emi', title: l.name + ' EMI', amount: row.emi, ref: l.id, src: 'loan' });

}

  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action.label)}</button>` : '');

  sh.innerHTML = `<div class="sheet-grab"></div><div class="sheet-h"><h2>${esc(title)}</h2>${opts.headerExtra || ''}<button class="icon-btn" data-close aria-label="Close">${I('x')}</button></div><div class="sheet-b">${html}</div>`;
  document.body.append(scrim, sh); document.body.style.overflow = 'hidden';
  const api = { el: sh, body: sh.querySelector('.sheet-b'), close };
  function close() {
    sh.classList.remove('show'); scrim.classList.remove('show');
    setTimeout(() => { sh.remove(); scrim.remove(); }, 300);
    const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1); if (!sheets.length) document.body.style.overflow = '';
    opts.onClose && opts.onClose();
  }
  scrim.onclick = close; sh.querySelector('[data-close]').onclick = close;

  const start = e => { if (window.innerWidth >= 700) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; };
  const move = e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) close(); y0 = null; };
  [grab, sh.querySelector('.sheet-grab')].forEach(g => { g.addEventListener('touchstart', start, { passive: true }); g.addEventListener('touchmove', move, { passive: true }); g.addEventListener('touchend', end); });

}

/* ================= charts ================= */
function niceScale(v, n = 4) { if (v <= 0) v = 1; const raw = v / n; const e = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / e; const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; const k = Math.ceil(v / step); return { max: step * k, ticks: k }; }
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

// grouped bars: labels[], series [{name,color,values}]
function barChart(...a) { return chartSlot('bar', a); }
function drawBar(W, labels, series, h = 190) {
  const H = h, pl = 44, pr = 6, pt = 10, pb = 24;
  const sc = niceScale(Math.max(1, ...series.flatMap(s => s.values))); const max = sc.max, T = sc.ticks;
  const cw = (W - pl - pr) / labels.length; const gw = Math.min(cw * 0.7, 54); const bw = gw / series.length;
  let g = '';
  for (let i = 0; i <= T; i++) { const y = pt + (H - pt - pb) * (1 - i / T); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y + 3.5}" text-anchor="end">${fmtC(max * i / T)}</text>`; }
  labels.forEach((l, i) => {
    const x0 = pl + cw * i + (cw - gw) / 2;
    series.forEach((s, j) => { const v = s.values[i] || 0; const bh = (H - pt - pb) * v / max; const x = x0 + j * bw; g += `<rect x="${x + 1}" y="${H - pb - bh}" width="${Math.max(1, bw - 2)}" height="${Math.max(0, bh)}" rx="${Math.min(3, bw / 3)}" fill="${s.color}"><title>${esc(s.name)} ${esc(l)}: ${fmt(v)}</title></rect>`; });
    g += `<text x="${pl + cw * i + cw / 2}" y="${H - 7}" text-anchor="middle">${esc(l)}</text>`;
  });
  const leg = series.length > 1 ? `<div class="legend">${series.map(s => `<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Bar chart">${g}</svg>${leg}`;
}

function lineChart(...a) { return chartSlot('line', a); }
function drawLine(W, labels, values, color = 'var(--accent)', h = 180) {
  const H = h, pl = 48, pr = 8, pt = 12, pb = 24;
  const mn0 = Math.min(0, ...values), mx0 = Math.max(1, ...values);
  const span0 = mx0 - Math.min(0, mn0); const sc = niceScale(span0); const step = sc.max / sc.ticks;
  const mn = mn0 < 0 ? -Math.ceil(-mn0 / step) * step : 0; const mx = Math.ceil(mx0 / step) * step || step; const T = Math.round((mx - mn) / step);
  const X = i => pl + (W - pl - pr) * (labels.length === 1 ? 0.5 : i / (labels.length - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let i = 0; i <= T; i++) { const v = mn + step * i, y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 8}" y="${y + 3.5}" text-anchor="end">${fmtC(v)}</text>`; }
  const pts = values.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
  g += `<polygon points="${X(0)},${Y(Math.max(mn, 0))} ${pts} ${X(values.length - 1)},${Y(Math.max(mn, 0))}" fill="${color}" opacity=".08"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  values.forEach((v, i) => { g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="var(--surface)" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`; });
  const lstep = Math.ceil(labels.length / 8);
  labels.forEach((l, i) => { if (i % lstep === 0 || i === labels.length - 1) g += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle">${esc(l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart">${g}</svg>`;
}

const CHARTS = {}; let _chN = 0;
function chartSlot(kind, args) { const id = 'ch' + (++_chN); CHARTS[id] = { kind, args }; const h = kind === 'bar' ? (args[2] || 190) : (args[3] || 180); return `<div class="chartbox" data-ch="${id}" style="min-height:${h}px"></div>`; }
function drawCharts(root = document) {
  $$('.chartbox', root).forEach(el => { const c = CHARTS[el.dataset.ch]; if (!c) return; const W = Math.max(240, Math.floor(el.clientWidth)); if (el._w === W) return; el._w = W; el.innerHTML = c.kind === 'bar' ? drawBar(W, ...c.args) : drawLine(W, ...c.args); });
}
let _rsT; window.addEventListener('resize', () => { clearTimeout(_rsT); _rsT = setTimeout(() => drawCharts(), 150); });
// items [{label,value,color}] -> interactive donut with legend
let _donutN = 0;
function donut(items, centerLabel = 'Total') {
  items = items.filter(x => x.value > 0).sort((a, b) => b.value - a.value);
  if (items.length > 8) { const rest = items.slice(7); items = items.slice(0, 7).concat({ label: 'Everything else', value: sum(rest, x => x.value), color: '#9BA0AC' }); }
  const total = sum(items, x => x.value); const id = 'dn' + (++_donutN);
  if (!total) return `<p class="muted small">Nothing to show for this period yet.</p>`;
  const R = 62, r = 44, C = 75; let a0 = -Math.PI / 2; let arcs = '';
  items.forEach((it, i) => {
    const frac = it.value / total; const a1 = a0 + frac * Math.PI * 2 - (items.length > 1 ? 0.012 : 0);
    const large = a1 - a0 > Math.PI ? 1 : 0; const P = (rad, a) => `${C + rad * Math.cos(a)},${C + rad * Math.sin(a)}`;
    const d = frac >= 0.9999 ? `M${C - R},${C}a${R},${R} 0 1,0 ${R * 2},0a${R},${R} 0 1,0 -${R * 2},0M${C - r},${C}a${r},${r} 0 1,1 ${r * 2},0a${r},${r} 0 1,1 -${r * 2},0` : `M${P(R, a0)}A${R},${R} 0 ${large} 1 ${P(R, a1)}L${P(r, a1)}A${r},${r} 0 ${large} 0 ${P(r, a0)}Z`;
    arcs += `<path class="seg-arc" data-i="${i}" d="${d}" fill="${it.color}" fill-rule="evenodd" style="cursor:pointer"/>`;
    a0 += frac * Math.PI * 2;
  });
  const legend = items.map((it, i) => `<button class="dl-row" data-i="${i}"><b style="background:${it.color}"></b><span>${esc(it.label)}</span><em>${fmt(it.value)}</em></button>`).join('');
  const data = JSON.stringify(items.map(x => [x.label, x.value]));
  return `<div class="donut-wrap" id="${id}" data-items='${esc(data)}' data-total="${total}" data-cl="${esc(centerLabel)}">
    <svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Donut chart">${arcs}
      <text x="75" y="70" text-anchor="middle" style="fill:var(--muted);font-size:10.5px" class="dc-l">${esc(centerLabel)}</text>
      <text x="75" y="88" text-anchor="middle" style="fill:var(--text);font-size:15px;font-weight:650" class="dc-v">${esc(fmtC(total))}</text></svg>
    <div class="dl">${legend}</div></div>`;
}
function wireDonuts(root) {
  $$('.donut-wrap', root).forEach(w => {
    const items = JSON.parse(w.dataset.items); const total = +w.dataset.total; let sel = -1;
    const set = i => {
      sel = sel === i ? -1 : i;
      $$('.seg-arc', w).forEach(p => (p.style.opacity = sel < 0 || +p.dataset.i === sel ? 1 : 0.25));
      $$('.dl-row', w).forEach(b => b.classList.toggle('on', +b.dataset.i === sel));
      $('.dc-l', w).textContent = sel < 0 ? w.dataset.cl : items[sel][0].slice(0, 16);
      $('.dc-v', w).textContent = sel < 0 ? fmtC(total) : pct(items[sel][1] / total);
    };
    $$('.seg-arc,.dl-row', w).forEach(el => el.addEventListener('click', () => set(+el.dataset.i)));
  });
}

function progress(v, max, cls = '') { const p = max ? clamp(v / max, 0, 1) : 0; const c = max && v / max >= 1 ? 'over' : max && v / max >= 0.8 ? 'warn' : ''; return `<div class="bar ${cls} ${cls.includes('plain') ? '' : c}"><i style="width:${(p * 100).toFixed(1)}%"></i></div>`; }
function deltaPill(cur, prev, goodWhenDown) {
  if (!prev) return cur ? `<span class="delta flat">New this month</span>` : '';
  const d = (cur - prev) / prev; if (Math.abs(d) < 0.005) return `<span class="delta flat">Same as last month</span>`;
  const down = d < 0; const good = goodWhenDown ? down : !down;
  return `<span class="delta ${good ? 'good' : 'bad'}">${down ? '↓' : '↑'} ${Math.abs(d * 100).toFixed(1)}% vs last month</span>`;
}

function renderTxList() {

function goalCalc(g) {

  const months = g.targetDate ? Math.max(1, (parseD(g.targetDate).getFullYear() - new Date().getFullYear()) * 12 + parseD(g.targetDate).getMonth() - new Date().getMonth()) : 0;
  const need = months ? rem / months : 0; const mc = +g.monthly || 0;
  const eta = mc > 0 ? addMonths(today(), Math.ceil(rem / mc)) : null;
  return { rem, months, need, eta, onTrack: !g.targetDate || !mc || mc >= need - 1 };
}

  const essAvg = ess3.length ? sum(ess3) / ess3.length : m.essential;
  const debtPay = m.emi;
  const r = { sr: m.savingsRate, er: m.income ? m.expense / m.income : 0, ir: m.income ? m.investment / m.income : 0, dti: m.income ? debtPay / m.income : 0, ef: essAvg ? liquid / essAvg : 0 };

  const changes = Object.keys({ ...m.byCat, ...pm.byCat }).map(id => ({ id, d: (m.byCat[id] || 0) - (pm.byCat[id] || 0) })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));

  if (r.ef) ins.push(['🛟', r.ef >= 6 ? `Liquid money covers ${r.ef.toFixed(1)} months of essentials. That's a solid cushion.` : `Liquid money covers ${r.ef.toFixed(1)} months of essentials. 6 months is a common target.`]);
  if (m.income && r.ir < 0.1 && m.investment >= 0) ins.push(['📈', `You invested ${pct(r.ir)} of income. Even a small SIP increase compounds.`]);
  if (ins.length) h += `<section class="card"><div class="card-h"><h3>What changed</h3></div>${ins.map(([i, t]) => `<div class="insight"><i>${i}</i><span>${esc(t)}</span></div>`).join('')}</section>`;
  const ratio = (name, v, f, hint, good) => `<div class="kv"><span>${name}<br><small class="faint">${hint}</small></span><span style="color:${good === undefined ? 'var(--text)' : good ? 'var(--in)' : 'var(--debt)'}">${f}</span></div>`;

    ${ratio('Expense ratio', r.er, pct(r.er), 'Expenses ÷ income', m.income ? r.er <= 0.7 : undefined)}
    ${ratio('Investment rate', r.ir, pct(r.ir), 'Investments ÷ income', m.income ? r.ir >= 0.15 : undefined)}
    ${ratio('Debt-to-income', r.dti, pct(r.dti), 'EMIs ÷ income', m.income ? r.dti <= 0.4 : undefined)}
    ${ratio('Emergency fund', r.ef, r.ef ? r.ef.toFixed(1) + ' months' : '—', 'Liquid money ÷ monthly essentials', r.ef ? r.ef >= 6 : undefined)}
    <p class="small muted" style="margin:10px 0 0">Essentials are categories marked essential (housing, food, utilities, health, transport, EMI, insurance). Change this in Settings → Categories.</p></section>
   <section class="card"><div class="card-h"><h3>Biggest categories</h3></div>${Object.entries(m.byCat).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id, v]) => `<div style="margin-bottom:12px"><div class="flex between small"><span style="font-weight:550">${esc(catById(id)?.icon || '')} ${esc(catName(id))}</span><span class="num">${fmt(v)} <span class="muted">${pct(v / (m.expense || 1))}</span></span></div><div class="bar mt8"><i style="width:${v / (Object.values(m.byCat).reduce((a, b) => Math.max(a, b), 0) || 1) * 100}%;background:${catColor(id)}"></i></div></div>`).join('') || '<p class="muted small">No expenses this month.</p>'}</section></div>`;
  const big = S.transactions.filter(t => t.type === 'expense' && mk(t.date) === k).sort((a, b) => b.amount - a.amount).slice(0, 5);
  h += `<section class="card"><div class="card-h"><h3>Biggest transactions</h3></div>${big.length ? `<div class="list">${big.map(t => txRow(t, true)).join('')}</div>` : '<p class="muted small">None yet.</p>'}</section>`;
  const cm = monthsBack(6, k);
  h += `<section class="card"><div class="card-h"><h3>Month on month</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Income</th><th>Spent</th><th>Invested</th><th>Saved %</th></tr></thead><tbody>${cm.slice().reverse().map(x => { const s = monthStats(x); return `<tr><td>${mkLabel(x, true)}</td><td>${fmt(s.income)}</td><td>${fmt(s.expense)}</td><td>${fmt(s.investment)}</td><td>${s.income ? pct(s.savingsRate) : '—'}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  return h;
}

async function resizeImage(file, max = 1200) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

function budgetNudge(tx) {
  if (tx.type !== 'expense' || mk(tx.date) !== curMk()) return;

  setTimeout(() => {

  }, 2400);
}

const ROUTES = {

  loans: vLoans, loan: vLoan, investments: vInvestments, networth: vNetWorth, budget: vBudget, recurring: vRecurring, goals: vGoals,

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?');
  const [name, id] = (path || 'dashboard').split('/');
  return { name: ROUTES[name] ? name : 'dashboard', id, params: new URLSearchParams(qs || '') };
}

/* ================= backup / restore / export ================= */
function backupPayload() {
  const meta = { ...S.meta }; delete meta.pinHash; delete meta.pinSalt;
  return { app: 'MoneyOS', version: 1, exportedAt: new Date().toISOString(), currency: S.settings.currency,
    data: { transactions: S.transactions, accounts: S.accounts, categories: S.categories, budgets: S.budgets, goals: S.goals, investments: S.investments, loans: S.loans, recurring: S.recurring, settings: S.settings, meta } };
}
async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime }); const file = new File([blob], name, { type: mime });
  const touch = matchMedia('(pointer:coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
}
function markBackedUp() { S.meta.lastBackup = new Date().toISOString(); saveMeta(); rerenderPage(); }
function openBackup() {
  const json = JSON.stringify(backupPayload()); const kb = (json.length / 1024).toFixed(0);
  openSheet('Back up your data', `<p class="muted" style="margin:4px 0 14px">Your data is stored locally. Back up regularly so you don't lose it if you clear browser data or change devices. On iPhone, choose <b style="color:var(--text)">Save to Files</b> and pick iCloud Drive.</p>
    <div class="kv"><span>Transactions</span><span>${S.transactions.length.toLocaleString('en-IN')}</span></div><div class="kv"><span>Backup size</span><span>${kb} KB</span></div>
    <button class="btn primary block mt16" data-x="file">${I('download')} Save backup file</button><button class="btn block mt12" data-x="copy">Copy backup to clipboard</button>
    <p class="small muted" style="margin:12px 0 0">Backups don't include your PIN. Keep the file private, it contains all your financial records.</p>`, s => {
    s.el.addEventListener('click', async e => {
      const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return;
      if (x === 'file') { const ok = await saveFile(`moneyos-backup-${today()}.json`, json, 'application/json'); if (ok) { markBackedUp(); s.close(); toast('Backup saved'); } }
      if (x === 'copy') { try { await navigator.clipboard.writeText(json); markBackedUp(); s.close(); toast('Backup copied. Paste it into Notes or Files.'); } catch { toast('Clipboard not available here'); } }
    });
  });
}
function openRestore() {
  openSheet('Restore backup', `<p class="muted" style="margin:4px 0 14px">Restoring replaces everything currently on this device with the backup.</p>
    <label class="btn primary block" style="cursor:pointer">${I('upload')} Choose backup file<input type="file" accept=".json,application/json" class="hidden" id="rfile"></label>
    <label class="field"><span>Or paste backup text</span><textarea class="input" id="rtext" placeholder='{"app":"MoneyOS",…}'></textarea></label><button class="btn block mt12" data-x="paste">Restore from pasted text</button>`, s => {
    const doRestore = async text => {
      let p; try { p = JSON.parse(text); } catch { toast('That file isn’t valid JSON'); return; }
      const d = p.data || p; if (!Array.isArray(d.transactions) || !Array.isArray(d.accounts)) { toast('This doesn’t look like a MoneyOS backup'); return; }
      if (!(await confirmSheet('Replace current data?', `The backup from ${p.exportedAt ? fmtDate(p.exportedAt.slice(0, 10)) : 'an unknown date'} has ${d.transactions.length} transactions and ${d.accounts.length} accounts. Current data on this device will be replaced.`, 'Restore', true))) return;
      for (const st of STORES.filter(x => x !== 'kv')) { S[st] = Array.isArray(d[st]) ? d[st] : []; await DB.bulk(st, S[st], true); }
      if (!S.categories.length) { const keepA = S.accounts; seedDefaults(); S.accounts = keepA.length ? keepA : S.accounts; await DB.bulk('categories', S.categories, true); }
      S.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) }; const pin = { pinHash: S.meta.pinHash, pinSalt: S.meta.pinSalt };
      S.meta = { ...(d.meta || {}), ...(pin.pinHash ? pin : {}), lastBackup: p.exportedAt || S.meta.lastBackup };
      await saveSettings(); await saveMeta(); _nf = {}; bump(); applyTheme(); await processRecurring();
      s.close(); go('dashboard'); toast('Backup restored');
    };
    $('#rfile', s.el).addEventListener('change', async e => { const f = e.target.files[0]; if (f) doRestore(await f.text()); });
    s.el.querySelector('[data-x="paste"]').onclick = () => { const t = $('#rtext', s.el).value.trim(); if (t) doRestore(t); };

}
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvRows = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function txCsvRows(list) {
  return [['Date', 'Type', 'Description', 'Category', 'Account', 'To account', 'Amount', 'Currency', 'Payment method', 'Tags', 'Notes', 'Recurring']].concat(
    list.map(t => [t.date, t.type, t.description, t.type === 'transfer' ? '' : t.type === 'investment' ? 'Investment' : catName(t.categoryId), acctById(t.accountId)?.name || '', acctById(t.toAccountId)?.name || '', t.amount, t.currency || S.settings.currency, t.paymentMethod || '', (t.tags || []).join('; '), t.notes || '', t.recurringId ? 'yes' : '']));
}
async function exportCsv(month) {
  const list = (month ? txSorted().filter(t => mk(t.date) === month) : parseRoute().name === 'transactions' ? filteredTx() : txSorted());
  if (!list.length) return toast('No transactions to export');
  await saveFile(`moneyos-transactions${month ? '-' + month : ''}-${today()}.csv`, '\uFEFF' + csvRows(txCsvRows(list)), 'text/csv');
  toast(`Exported ${list.length} transactions`);
}
async function exportAllCsv() {
  const sec = (title, rows) => `${title}\r\n${csvRows(rows)}\r\n\r\n`;

  out += sec('ACCOUNTS', [['Name', 'Type', 'Institution', 'Last 4', 'Opening balance', 'Current balance', 'Credit limit']].concat(S.accounts.map(a => [a.name, ACCT_TYPES[a.type], a.institution, a.last4, a.openingBalance, round2(b[a.id] || 0), a.limit || ''])));

  out += sec('GOALS', [['Name', 'Type', 'Target', 'Current', 'Target date', 'Monthly contribution']].concat(S.goals.map(g => [g.name, g.type, g.target, g.current, g.targetDate, g.monthly])));

async function wipeAll() {
  if (!(await confirmSheet('Erase all data?', 'Every transaction, account, budget and goal will be deleted from this device. Make a backup first if you might need it.', 'Erase everything', true))) return;
  for (const st of STORES) await DB.bulk(st, [], true);
  Object.assign(S, { transactions: [], budgets: [], goals: [], investments: [], loans: [], recurring: [], meta: {}, settings: { ...DEFAULT_SETTINGS, widgets: DEFAULT_SETTINGS.widgets.map(w => [...w]) } });
  seedDefaults(); await DB.bulk('categories', S.categories); await DB.bulk('accounts', S.accounts); bump(); applyTheme(); go('dashboard'); toast('All data erased');

/* ================= PIN lock ================= */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (crypto?.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return 'x' + h.toString(16);
}
function showLock({ title = 'Enter PIN', verify = true, onDone, cancel = false } = {}) {
  if ($('.lock')) return; let pin = '';
  const el = document.createElement('div'); el.className = 'lock'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', title);
  const draw = () => { el.innerHTML = `<div class="brand" style="font:700 20px var(--display);display:flex;gap:10px;align-items:center"><span style="width:30px;height:30px;border-radius:9px;background:var(--text);display:grid;place-items:center"><span style="width:11px;height:11px;border-radius:3px;background:var(--accent)"></span></span>MoneyOS</div><h2>${esc(title)}</h2><div class="pin-dots">${[0, 1, 2, 3].map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="ghost" data-k="${cancel ? 'cancel' : 'forgot'}">${cancel ? 'Cancel' : 'Forgot?'}</button><button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Delete">⌫</button></div>`; };
  draw(); document.body.appendChild(el);
  const press = async k => {
    if (k === 'cancel') { el.remove(); return; }
    if (k === 'forgot') { el.style.zIndex = 30; if (await confirmSheet('Forgot your PIN?', 'The PIN can’t be recovered because nothing is stored online. You can erase this device’s MoneyOS data and restore from a backup.', 'Erase and start over', true)) { el.remove(); for (const st of STORES) await DB.bulk(st, [], true); location.reload(); } el.style.zIndex = ''; return; }
    if (k === 'del') { pin = pin.slice(0, -1); draw(); return; }
    if (pin.length >= 4) return; pin += k; draw();
    if (pin.length === 4) {
      if (!verify) { setTimeout(() => { el.remove(); onDone(pin); }, 120); return; }
      if (await hashPin(pin, S.meta.pinSalt) === S.meta.pinHash) { setTimeout(() => { el.remove(); onDone && onDone(); }, 100); }
      else { const dots = $('.pin-dots', el); dots.classList.add('shake'); navigator.vibrate?.(80); setTimeout(() => { pin = ''; draw(); }, 380); }
    }
  };
  el.addEventListener('click', e => { const k = e.target.closest('[data-k]')?.dataset.k; if (k) press(k); });
  const kd = e => { if (!document.body.contains(el)) return document.removeEventListener('keydown', kd); if (/^\d$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('del'); };
  document.addEventListener('keydown', kd);
}
function setPinFlow() {
  showLock({ title: 'Choose a 4-digit PIN', verify: false, cancel: true, onDone: p1 => showLock({ title: 'Enter it again', verify: false, cancel: true, onDone: async p2 => {
    if (p1 !== p2) { toast('PINs didn’t match. Try again.'); rerenderPage(); return; }
    S.meta.pinSalt = uid(); S.meta.pinHash = await hashPin(p1, S.meta.pinSalt); await saveMeta(); rerenderPage(); toast('App lock is on');
  } }) });
  setTimeout(rerenderPage, 50);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (S.meta.pinHash && hiddenAt && Date.now() - hiddenAt > 60000) showLock({ title: 'Enter PIN' });
});

/* ================= theme ================= */
function applyTheme() {
  const t = S.settings.theme; if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]')?.setAttribute('content', dark ? '#121316' : '#F5F6F8');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ================= boot ================= */
async function boot() {
  await loadAll(); applyTheme();
  await processRecurring();
  const start = () => { render(false); $('#app').classList.remove('hidden'); };
  if (S.meta.pinHash) { $('#app').classList.add('hidden'); showLock({ title: 'Enter PIN', onDone: start }); } else start();
  if (DB.mem) setTimeout(() => toast('Storage is unavailable in this browser mode. Data won’t be saved.'), 800);
  try { navigator.storage?.persist?.(); } catch {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('./sw.js').catch(() => {});
  // new day while app is open → post recurring
  setInterval(async () => { if (await processRecurring()) rerenderPage(); }, 30 * 60 * 1000);
}
boot();
